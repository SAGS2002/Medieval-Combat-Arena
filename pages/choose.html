<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/choose.css">
    <title>Batalla RPG</title>
</head>

<body>
    <section class="container">
        <div id="choose">
            <h3 class="choose-title">Escoja su clase</h3>
            <div class="choose-card">

                <div class="class-choose">
                    <img src="/assets/Guerrero.png" alt="Guerrero">
                    <div class="stats">
                        <p>❤️ Vida: 120</p>
                        <p>🛡️ Armadura: 50</p>
                        <p>🐢 Velocidad: 20</p>
                    </div>
                    <button class="type" data-tipo="Guerrero">Guerrero</button>
                </div>

                <div class="class-choose">
                    <img src="/assets/Mago.png" alt="Mago">
                    <div class="stats">
                        <p>❤️ Vida: 80</p>
                        <p>🔮 Maná: 50</p>
                        <p>⚡ Velocidad: 50</p>
                    </div>
                    <button class="type" data-tipo="Mago">Mago</button>
                </div>

                <div class="class-choose">
                    <img src="/assets/Arquero.png" alt="Arquero">
                    <div class="stats">
                        <p>❤️ Vida: 100</p>
                        <p>🎯 Crítico: 50%</p>
                        <p>🏹 Velocidad: 30</p>
                    </div>
                    <button class="type" data-tipo="Arquero">Arquero</button>
                </div>

                <div class="class-choose favorite-card">
                    <div class="badge">★ Favorito del Dev ★</div> <img src="/assets/Bandido.png" alt="Bandido">
                    <div class="stats">
                        <p>❤️ Vida: 90</p>
                        <p>🔪 Astucia: Alta</p>
                        <p>💨 Velocidad: 60</p>
                    </div>
                    <button class="type" data-tipo="Bandido">Bandido</button>
                </div>

            </div>

        </div>
    </section>




    <script type="module" src="/js/script.js"></script>
</body>

</html>
